name: Godot smoke tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Run gameplay and system tests
        run: |
          godot --headless --path . --script res://tests/smoke.gd
          godot --headless --path . --script res://tests/systems.gd
          godot --headless --path . --script res://tests/world_camera.gd
          godot --headless --path . --script res://tests/ui.gd
          godot --headless --path . --script res://tests/construction.gd
          godot --headless --path . --script res://tests/production.gd
          godot --headless --path . --script res://tests/living_field.gd
